<!doctype html>
<html lang="en" class="wa-theme-shoelace wa-palette-shoelace wa-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#19191c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GunnMap" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Your Campus Map · GunnMap</title>
    <link rel="stylesheet" href="/ui.css" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/generate-map.js"></script>
  </head>
  <body>
    <header class="site-sidebar">
      <a class="brand" href="/" aria-label="GunnMap home">
        <span class="brand-mark icon-campus" aria-hidden="true"></span>
        <span class="brand-name">Gunn<span>Map</span></span>
      </a>
    </header>
    <nav class="site-nav" aria-label="Campus maps">
      <a href="/"><span class="nav-icon icon-campus" aria-hidden="true"></span><span>Schedule Map</span></a>
      <a href="/evacuation"><span class="nav-icon icon-routes" aria-hidden="true"></span><span>Evacuation Routes</span></a>
      <a href="/find-room"><span class="nav-icon icon-search" aria-hidden="true"></span><span>Find a Room</span></a>
      <a href="/generate-map" aria-current="page"><span class="nav-icon icon-generated-map" aria-hidden="true"></span><span>Generated Map</span></a>
    </nav>
    <div class="app-content">
      <main id="main-content" class="generated-map-layout" tabindex="-1">
        <section class="panel generated-map-panel" aria-labelledby="generated-map-title">
          <div class="panel-heading">
            <div>
              <div class="eyebrow">MAP PREVIEW</div>
              <h1 id="generated-map-title">Your campus map</h1>
            </div>
            <div class="generated-map-actions">
              <a id="generated-map-download" class="download-link" href="#" download="gunn-period-map.png" hidden>Download PNG</a>
              <a class="download-link" href="/">Edit schedule</a>
            </div>
          </div>
          <p id="generated-map-help" class="map-help" hidden>Drag to move · Scroll or pinch to zoom</p>
          <div id="generated-map-empty" class="generated-map-empty" hidden>
            <p>Generate a map from your schedule to view it here.</p>
            <a class="primary-button" href="/">Go to Schedule Map</a>
          </div>
          <div id="generated-map-content" class="generated-map-content" hidden>
            <div id="generated-map-stage" class="generated-map-stage" role="region" aria-label="Zoomable schedule map" tabindex="0">
              <div id="generated-map-art" class="generated-map-art">
                <img id="generated-map-image" alt="Gunn campus map with your schedule rooms highlighted" />
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer class="site-footer"><span>GunnMap <span aria-hidden="true">·</span> Henry M. Gunn High School</span><span>Unofficial student resource</span></footer>
    </div>
  </body>
</html>
